# Test 1: legacy HELIOS <-> GGchem coupling (run_coupled.py, EqCond+Remove as grids/h2dom.yaml), every run from 500 K.
runner: coupled
out_dir: output/session_tests/t1_legacy
name: "Tint={internal_temp}"

fixed:
  outgas_or_manual: manual
  chemistry: equilibrium
  toa_pressure: 1.0e-1      # dyn/cm^2 (= 1e-7 bar)
  surface_pressure: 1.0e7   # dyn/cm^2 (= 10 bar)
  CplusO: 1.0e-2
  CtoO: 0.59
  X_N: 1.0e-4

grid:
  internal_temp: [200, 175, 150, 125, 100, 75, 50]   # K, decreasing (the order of the runs)

derive: [c_plus_o_abundances]
