# First cloud test: one H2O-ice deck (LX-MIE, Warren 1984 optical constants) in the representative FFP-exomoon case
# of Dahlbuedding et al. (2026, Fig. 1): P_surf = 10 bar, T_int = 100 K, X_C+O = 1e-2, C/O = 0.59, X_N = 1e-4.
# Cloud-free baseline + deck base at 1, 0.1, 0.01 bar x optical depth 0.1, 1, 10 = 10 runs.
# Needs the Mie files (README "Clouds"):
#   python3 -m chelio_sim.make_mie_files --ri helios_inputs/clouds/refractive_index/H2O_s.dat --out helios_inputs/clouds/H2O_s/
# cloud_tau / cloud_pbot_bar are labels; the hook cloud_from_tau turns them into cloud_bottom_pressure and
# cloud_bottom_mixing_ratio (tau = Planck mean at T_int, see chelio_sim/clouds.py).
runner: coupled
out_dir: output/cloud_test
name: "Earth_P0={P0}_Tint={internal_temp}_CplusO={CplusO_name}_CtoO={CtoO_name}{aN_suffix}_cloud={cloud_name}"

fixed:
  outgas_or_manual: manual
  chemistry: equilibrium
  toa_pressure: 1.0e-1          # dyn/cm^2, same as grids/h2dom.yaml
  surface_pressure: 1.0e7       # dyn/cm^2
  internal_temp: 100
  planet: Earth                 # label: g = 981 cm/s^2 from helios_inputs/param.dat
  CplusO: 1.0e-2
  CtoO: 0.59
  X_N: 1.0e-4
  cloud_mie_path: helios_inputs/clouds/H2O_s/
  cloud_r_mode: 2.0             # micron, mode of dN/dr
  cloud_r_std_dev: 2.0
  cloud_to_gas_scale_height_ratio: 0.5

grid: {}                        # one empty combination: the runs come from `cases`

cases:
  - cloud_tau: 0                # baseline, cloud-free
  - cloud_pbot_bar: [0.1, 1.0, 0.01]
    cloud_tau: [1.0, 0.1, 10.0]

derive: [c_plus_o_abundances, cloud_from_tau]
